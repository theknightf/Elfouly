name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Runs the server in-process tests. The Supabase tests need real keys and are skipped
      # automatically when VITE_SUPABASE_URL is not set.
      - run: npm test
