<style data-purpose="pixel-rendering">
    /* Pixelated image and crisp vector rendering for authentic retro feel */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    
    .pixelated-bg {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    /* Tactile 3D pixel-art beveled button styles matching screenshot */
    .menu-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border-radius: 9px;
      border: 3.5px solid #24140e;
      box-shadow: 
        inset 0 3px 0 0 rgba(255, 255, 255, 0.35),
        inset 0 -3px 0 0 rgba(0, 0, 0, 0.45),
        0 4px 6px rgba(0, 0, 0, 0.6);
      transition: all 0.08s ease-in-out;
      cursor: pointer;
    }

    .menu-btn:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 
        inset 0 1px 0 0 rgba(255, 255, 255, 0.2),
        inset 0 -2px 0 0 rgba(0, 0, 0, 0.5),
        0 1px 2px rgba(0, 0, 0, 0.5);
    }

      border-color: #112814;
    }
    .btn-blue {
      background: linear-gradient(180deg, #2a5d8c 0%, #1a4269 50%, #102e4d 100%);
      border-color: #0b1e33;
    }
    .btn-purple {
      background: linear-gradient(180deg, #5b306b 0%, #442052 50%, #2b1236 100%);
      border-color: #1f0b26;
    }
    .btn-brown {
      background: linear-gradient(180deg, #996232 0%, #76451e 50%, #542d10 100%);
      border-color: #381a06;
    }
    .btn-crimson {
      background: linear-gradient(180deg, #872e29 0%, #681d19 50%, #4a110e 100%);
      border-color: #2b0806;
    }

    /* Text stroke and golden gradient for arcade text */
    .btn-label {
      font-family: 'Changa', 'Cairo', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      color: #ede2c9;
      text-shadow: 
        -1.5px -1.5px 0 #111,
         1.5px -1.5px 0 #111,
        -1.5px  1.5px 0 #111,
         1.5px  1.5px 0 #111,
         0 2.5px 0 #000;
      letter-spacing: 0.5px;
    }

    .icon-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.7));
    }

    /* Interactive hotspot highlight for the center roundabout */
    .roundabout-plate {
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .roundabout-plate:active {
      transform: scale(0.97);
      filter: brightness(1.1);
    }

<script data-purpose="audio-sfx-synthesizer">
    // Web Audio API Retro Arcade 8-bit sound generator (Zero external dependencies)
    class RetroAudio {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      playBlip(freq = 440, type = 'square', duration = 0.08) {
        try {
          this.init();
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.5, this.ctx.currentTime + duration);
          
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + duration);
          
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {
          // Silent fallback if autoplay policy restricts audio
        }
      }
    }

    const sfx = new RetroAudio();
  </script>
<script data-purpose="menu-events-handler">
    document.addEventListener('DOMContentLoaded', () => {
      const modal = document.getElementById('game-modal');
      const modalTitle = document.getElementById('modal-title');
      const modalMsg = document.getElementById('modal-message');
      const modalClose = document.getElementById('modal-close');
      const soundBtn = document.getElementById('btn-sound-toggle');
      let soundEnabled = true;

      const actions = {
        'play': { title: 'بدء السباق', text: 'استعد للإنطلاق من ميدان الإخصاص حتى جامعة اللوتس بالمنيا! 🏁' },
        'room-1': { title: 'غرفة خاصة', text: 'انضم لسباق الأصدقاء في شوارع عروس الصعيد.' },
        'room-2': { title: 'تحدي لاعب ضد لاعب', text: 'اختر سيارتك المفضلة: MG5 أو نوبيرا وتحدّى أبطال المنيا.' },
        'leaderboard': { title: 'قائمة المتصدرين', text: 'أسرع السائقين في طريق مصر أسوان الزراعي والإخصاص.' },
        'settings': { title: 'الإعدادات', text: 'تعديل الجرافيك، أزرار التحكم وحساسية عجلة القيادة.' },
        'exit': { title: 'خروج من اللعبة', text: 'هل تود العودة لشاشة البداية الرئيسية؟' }
      };

      // Menu button interactions
      document.querySelectorAll('.menu-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          if (soundEnabled) sfx.playBlip(540, 'square', 0.1);
          const actKey = btn.getAttribute('data-action');
          const data = actions[actKey] || { title: 'المنيا', text: 'أصل الحكاية وأهلها أهل الجدعنة!' };
          
          modalTitle.textContent = data.title;
          modalMsg.textContent = data.text;
          modal.classList.remove('hidden');
        });
      });

      // Roundabout Landmark interaction
      const landmark = document.querySelector('[data-purpose="landmark-hotspot"]');
      if (landmark) {
        landmark.addEventListener('click', () => {
          if (soundEnabled) sfx.playBlip(680, 'triangle', 0.15);
          modalTitle.textContent = 'قرية وميدان الإخصاص';
          modalMsg.textContent = 'أشهر ميادين حي شمال المنيا ونقطة تجمع عشاق السيارات والسباقات الشعبية!';
          modal.classList.remove('hidden');
        });
      }

      // Close modal
      modalClose.addEventListener('click', () => {
        if (soundEnabled) sfx.playBlip(320, 'sine', 0.08);
        modal.classList.add('hidden');
      });

      // Sound Toggle
      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.classList.toggle('opacity-50', !soundEnabled);
        if (soundEnabled) sfx.playBlip(600, 'square', 0.05);
      });
    });
  </script>
